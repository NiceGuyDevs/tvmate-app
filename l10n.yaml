# Multi-language system: ARB files per locale (app_en.arb, app_he.arb, …) are the
# source of truth; `flutter gen-l10n` produces AppLocalizations for use in the app.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false

workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install deps
        script: flutter pub get

      - name: Auto signing (THIS FIXES EVERYTHING)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.barak.tvmate" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
